appId: com.kajtg.codezy
productName: CODEZY
copyright: Copyright © 2026 kajtg
directories:
  output: dist
  buildResources: build
# The renderer/main/preload bundles are self-contained (vite bundles every
# runtime dep; main only needs electron + node builtins), so nothing from
# node_modules ships.
files:
  - out/**/*
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
# One-click installer: double-click = UPDATE. It always installs to the
# standard per-user location (%LOCALAPPDATA%\Programs\CODEZY), finds any
# previous install through the com.kajtg.codezy uninstall key, removes it
# first and replaces it in place — there is no directory page to mis-click
# into creating a second copy. App data (%APPDATA%\CODEZY: settings,
# sessions) is never touched. The in-app updater runs the same exe with /S.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CODEZY
  uninstallDisplayName: CODEZY
  artifactName: CODEZY-Setup-${version}.exe
