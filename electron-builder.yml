appId: com.kajtg.codezy
productName: CODEZY
copyright: Copyright © 2026 kajtg
directories:
  output: dist
  buildResources: build
# The renderer/main/preload bundles are self-contained (vite bundles every
# runtime dep; main only needs electron + node builtins), so nothing from
# node_modules ships.
files:
  - out/**/*
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CODEZY
  uninstallDisplayName: CODEZY
  artifactName: CODEZY-Setup-${version}.exe
